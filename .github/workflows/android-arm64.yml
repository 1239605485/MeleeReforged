name: Android ARM64 test build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-host -DMR_BUILD_TESTS=ON
      - run: cmake --build build-host --parallel 2
      - run: ctest --test-dir build-host --output-on-failure
  android-arm64:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - name: Build Android ARM64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-android -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static -DMR_BUILD_TESTS=OFF -DMR_BUILD_MOD=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --parallel 2
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build-android/libMeleeReforged.android.arm64.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D build-android/libMeleeReforged.android.arm64.so | grep ' T create_kernel_mod$'
          python3 tools/package.py --build-dir build-android --output dist/MeleeReforged-Android-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeleeReforged-Android-arm64
          path: dist/MeleeReforged-Android-arm64.zip
          if-no-files-found: error
